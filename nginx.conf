upstream tamerhosny_backend {
    server web:8000;
}

# WebSocket upgrade support (اسمع معاه, live listener counts, etc.) -
# nginx only forwards the Upgrade/Connection headers that turn a plain
# HTTP request into a real WebSocket tunnel when explicitly told to;
# without this, every /ws/... handshake gets rejected before it ever
# reaches Django/Channels. $http_upgrade is empty on an ordinary
# request, so this maps to "close" there and "upgrade" only when the
# client actually asked for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# gzip: Django's own GZipMiddleware already compresses the app's HTML/
# JSON responses - this is what additionally compresses everything
# nginx serves directly (static/media never touch the Django process
# at all), and re-compresses the proxied responses too since nginx sits
# in front either way.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/xml+rss
    image/svg+xml font/ttf font/otf font/woff font/woff2;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Uploaded media (song/album/person covers, profile images) is
    # never edited in place - a new upload gets a new, distinct
    # filename, so caching an existing one forever is always safe.
    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # collectstatic output - filenames here aren't content-hashed, so a
    # deploy can legitimately overwrite one under the same name. A
    # week is long enough to matter for repeat visits, short enough
    # that a change doesn't stay stuck in a visitor's cache for long.
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://tamerhosny_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A WebSocket connection is meant to sit open and mostly idle
        # (a listener that's just following along sends almost nothing)
        # - nginx's normal proxy_read_timeout (60s) would otherwise cut
        # it after any quiet stretch, well within a real listening
        # session.
        proxy_read_timeout 86400s;
    }

    # Django can only render its own error pages (404/500/...) when it's
    # actually up and handling the request - a fully down/unreachable
    # upstream (crashed process, mid-deploy restart, timed-out request)
    # never reaches Django at all, so nginx has to serve something of
    # its own instead of its bare default error page.
    error_page 502 503 504 /static/errors/gateway.html;
    location = /static/errors/gateway.html {
        alias /app/staticfiles/errors/gateway.html;
        internal;
    }
}
