upstream tamerhosny_backend {
    server web:8000;
}

# gzip: Django's own GZipMiddleware already compresses the app's HTML/
# JSON responses - this is what additionally compresses everything
# nginx serves directly (static/media never touch the Django process
# at all), and re-compresses the proxied responses too since nginx sits
# in front either way.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/xml+rss
    image/svg+xml font/ttf font/otf font/woff font/woff2;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Uploaded media (song/album/person covers, profile images) is
    # never edited in place - a new upload gets a new, distinct
    # filename, so caching an existing one forever is always safe.
    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # collectstatic output - filenames here aren't content-hashed, so a
    # deploy can legitimately overwrite one under the same name. A
    # week is long enough to matter for repeat visits, short enough
    # that a change doesn't stay stuck in a visitor's cache for long.
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://tamerhosny_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
