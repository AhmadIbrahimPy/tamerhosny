{% load i18n bilingual %}
{% for song in liked_songs %}
<a href="{% url 'website_app:song-detail' song.slug %}" class="th-card aspect-square th-card-song plain"
  {% if song.audio_file %}data-song-id="{{ song.pk }}" data-audio-url="{{ song.audio_file.url }}"{% endif %}>
  <div class="th-img-wrap">
    {% if song.cover_image %}
      <img src="{{ song.cover_image.url }}" alt="{{ song|localized_field:'title' }}">
    {% elif song.album.cover_image %}
      <img src="{{ song.album.cover_image.url }}" alt="{{ song|localized_field:'title' }}">
    {% else %}
      <i class="bi bi-music-note-beamed icon-fallback"></i>
    {% endif %}
    <div class="th-play-badge"><span class="th-play-icon"><i class="bi bi-play-fill"></i></span></div>
  </div>
  <div class="th-body"><div class="th-title">{{ song|localized_field:'title' }}</div></div>
</a>
{% endfor %}
