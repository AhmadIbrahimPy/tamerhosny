{% load i18n %}
{% if ads %}
<div class="th-ad-slider" id="thAdSlider" data-interval="5000">
  <div class="th-ad-slides">
    {% for ad in ads %}
    <div class="th-ad-slide {% if forloop.first %}active{% endif %}">
      <a {% if ad.get_target_url %}href="{{ ad.get_target_url }}" {% if ad.is_linked_externally %}target="_blank" rel="noopener sponsored"{% endif %}{% endif %}
         class="th-ad-banner plain" onclick="thTrack('EXTERNAL_CLICK', 'ad', {{ ad.pk }}, {});">
        <img src="{{ ad.image.url }}" alt="{{ ad.title }}"
          {% if forloop.first %}loading="eager" fetchpriority="high"{% else %}loading="lazy"{% endif %} decoding="async">
        <span class="th-ad-tag">{% translate "إعلان" %}</span>
      </a>
      <script>document.addEventListener('DOMContentLoaded', function(){ thTrack('VIEW', 'ad', {{ ad.pk }}); });</script>
    </div>
    {% endfor %}
  </div>
  {% if ads|length > 1 %}
  <div class="th-ad-dots">
    {% for ad in ads %}
      <button type="button" class="th-ad-dot {% if forloop.first %}active{% endif %}" data-index="{{ forloop.counter0 }}" aria-label="{{ forloop.counter }}"></button>
    {% endfor %}
  </div>
  {% endif %}
</div>
<script>
(function(){
  var root = document.getElementById('thAdSlider');
  if (!root) return;
  var slides = root.querySelectorAll('.th-ad-slide');
  var dots = root.querySelectorAll('.th-ad-dot');
  if (slides.length < 2) return;
  var current = 0;
  var interval = parseInt(root.dataset.interval, 10) || 5000;

  // True crossfade, not an instant swap - the outgoing slide (display:
  // none the moment .active came off) used to vanish immediately while
  // the incoming one was still only midway through its own .5s fade-in,
  // leaving a real blank gap between them every single rotation. The
  // outgoing slide now stays fully visible in normal flow (so the
  // slider's own height never collapses either) while the incoming one
  // overlays it (position:absolute, see .th-ad-slide.entering) and
  // fades in on top - only once that finishes does the swap actually
  // happen (outgoing hidden, incoming becomes the new normal-flow
  // .active).
  var transitioning = false;

  function show(index) {
    if (transitioning) return;
    var nextIndex = (index + slides.length) % slides.length;
    if (nextIndex === current) return;
    transitioning = true;

    var outgoingIndex = current;
    var incoming = slides[nextIndex];
    incoming.classList.add('entering');
    if (dots[nextIndex]) dots[nextIndex].classList.add('active');
    if (dots[outgoingIndex]) dots[outgoingIndex].classList.remove('active');

    setTimeout(function () {
      slides[outgoingIndex].classList.remove('active');
      incoming.classList.remove('entering');
      incoming.classList.add('active');
      current = nextIndex;
      transitioning = false;
    }, 500); // matches @keyframes thFade's own .5s duration (base.html)
  }

  var timer = setInterval(function(){ show(current + 1); }, interval);

  dots.forEach(function(dot){
    dot.addEventListener('click', function(){
      clearInterval(timer);
      show(parseInt(dot.dataset.index, 10));
      timer = setInterval(function(){ show(current + 1); }, interval);
    });
  });
})();
</script>
{% endif %}
