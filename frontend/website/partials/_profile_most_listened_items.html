{% load i18n bilingual %}
{% for play in full_listens %}
<a href="{% url 'website_app:song-detail' play.song.slug %}" class="th-card aspect-square th-card-song plain"
  {% if play.song.audio_file %}data-song-id="{{ play.song.pk }}" data-audio-url="{{ play.song.audio_file.url }}"{% endif %}>
  <div class="th-img-wrap">
    {% if play.song.display_cover_url %}
      <img src="{{ play.song.display_cover_url }}" alt="{{ play.song|localized_field:'title' }}">
    {% else %}
      <i class="bi bi-music-note-beamed icon-fallback"></i>
    {% endif %}
    <div class="th-play-badge"><span class="th-play-icon"><i class="bi bi-play-fill"></i></span></div>
  </div>
  <div class="th-body">
    <div class="th-title">{{ play.song|localized_field:'title' }}</div>
    <div class="th-meta">{{ play.full_listen_count }} {% translate "استماع كامل" %}</div>
  </div>
</a>
{% endfor %}
