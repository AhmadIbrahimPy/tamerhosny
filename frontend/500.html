<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حصل خطأ | أرشيف تامر حسني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{
      --bg-1:#0b0c14; --bg-2:#171224; --accent:#d4af37; --accent-2:#8a5cff;
      --card-bg:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
      --text:#f2f1f6; --muted:#9a97ab;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;}
    body{
      font-family:'Cairo', system-ui, sans-serif;
      background:
        radial-gradient(1100px 600px at 15% 10%, rgba(138,92,255,.25), transparent 60%),
        radial-gradient(900px 500px at 90% 85%, rgba(212,175,55,.18), transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
      overflow:hidden;
    }
    .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;}
    .glow-1{width:340px;height:340px;background:var(--accent-2);top:-120px;right:-100px;}
    .glow-2{width:260px;height:260px;background:var(--accent);bottom:-100px;left:-80px;}

    .wrap{position:relative;z-index:1;width:100%;max-width:460px;text-align:center;}
    .mark{
      width:64px;height:64px;border-radius:18px;margin:0 auto 22px;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:24px;color:#0b0c14;
      box-shadow:0 10px 30px -8px rgba(212,175,55,.5);
    }

    .card{
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:24px;
      padding:44px 34px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
    }
    .code{
      font-size:72px;font-weight:900;line-height:1;margin:0 0 6px;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .icon{font-size:38px;color:var(--accent);margin-bottom:14px;}
    h1{font-size:21px;font-weight:800;margin:0 0 10px;}
    p{font-size:14.5px;color:var(--muted);line-height:1.8;margin:0 0 28px;}

    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:13px 28px;border:none;border-radius:12px;
      background:linear-gradient(135deg, var(--accent), #b98f2e);
      color:#0b0c14;font-weight:800;font-size:14.5px;cursor:pointer;
      text-decoration:none;transition:filter .15s;
    }
    .btn:hover{filter:brightness(1.08);}

    .footer-note{text-align:center;font-size:11.5px;color:#514e63;margin-top:22px;}
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="wrap">
    <div class="mark">TH</div>
    <div class="card">
      <i class="bi bi-exclamation-triangle-fill icon"></i>
      <div class="code">500</div>
      <h1>حصل خطأ من عندنا</h1>
      <p>في مشكلة مؤقتة في السيرفر وإحنا شغالين عليها. جرّب تاني بعد شوية.</p>
      <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> الرجوع للرئيسية</a>
    </div>
    <p class="footer-note">أرشيف تامر حسني</p>
  </div>
</body>
</html>
