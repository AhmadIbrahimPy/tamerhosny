{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | لوحة تحكم تامر حسني</title>
  {% include "dashboard/partials/head/head-links.html" %}
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: #f5f6fa;">
    <div class="card card-lg" style="width: 100%; max-width: 380px;">
      <div class="card-body p-6">
        <h4 class="mb-1">لوحة تحكم تامر حسني</h4>
        <p class="text-muted mb-4">سجّل دخولك للوصول إلى اللوحة</p>

        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">اسم المستخدم</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">كلمة المرور</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">دخول</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
