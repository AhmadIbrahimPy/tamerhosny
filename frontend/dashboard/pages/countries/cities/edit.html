{% extends "dashboard/index.html" %}
{% load static %}
{% block title %}Edit {{ city.name }}{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/dashboard/assets/css/form-inputs.css">
{% endblock %}

{% block content %}
  <!-- container -->
  <div class="custom-container">
    <!-- Toast Container -->
    <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1100;"></div>
    
    <div class="row g-6 mb-6">
      <div class="col-xl-12">
        <!-- card -->
        <div class="card card-lg">
          <div class="card-header border-bottom-0 d-flex justify-content-between align-items-center">
            <!-- heading -->
            <div>
              <h5 class="mb-0">Edit City - {{ city.name }}</h5>
            </div>
            <!-- button -->
            <div>
              <a href="/dashboard/countries/{{ country.slug }}/cities/{{ city.slug }}/" class="btn btn-outline-primary btn-sm">Back to Details</a>
            </div>
          </div>
          <!-- card body -->
          <div class="card-body">
            <form id="cityForm" data-city-id="{{ city.id }}" data-country-slug="{{ country.slug }}">
              <input type="hidden" name="city_id" value="{{ city.id }}">
              
              <!-- Basic Information Section -->
              <div class="mb-6">
                <h6 class="mb-4 text-primary fw-bold">Basic Information</h6>
                <div class="row g-4">
                  <div class="col-md-6">
                    <label class="form-label">City Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Enter city name" required value="{{ city.name }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Default Zoom</label>
                    <input type="number" class="form-control" name="default_zoom" placeholder="e.g., 10" value="{{ city.default_zoom }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Population</label>
                    <input type="number" class="form-control" name="population" placeholder="e.g., 10000000" value="{{ city.population|default:'' }}">
                  </div>
                </div>
              </div>

              <!-- Location Section -->
              <div class="mb-6">
                <h6 class="mb-4 text-primary fw-bold">Location</h6>
                <div class="row g-4">
                  <div class="col-md-3">
                    <label class="form-label">Latitude</label>
                    <input type="number" step="any" class="form-control" name="latitude" placeholder="e.g., 30.0444" value="{{ city.latitude|default:'' }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Longitude</label>
                    <input type="number" step="any" class="form-control" name="longitude" placeholder="e.g., 31.2357" value="{{ city.longitude|default:'' }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">South</label>
                    <input type="number" step="any" class="form-control" name="south" placeholder="South bound" value="{{ city.south|default:'' }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">North</label>
                    <input type="number" step="any" class="form-control" name="north" placeholder="North bound" value="{{ city.north|default:'' }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">West</label>
                    <input type="number" step="any" class="form-control" name="west" placeholder="West bound" value="{{ city.west|default:'' }}">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">East</label>
                    <input type="number" step="any" class="form-control" name="east" placeholder="East bound" value="{{ city.east|default:'' }}">
                  </div>
                </div>
              </div>

              <!-- Submit Section -->
              <div class="col-12">
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">Update</button>
                  <a href="/dashboard/countries/{{ country.slug }}/cities/{{ city.slug }}/" class="btn btn-outline-secondary">Cancel</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
<script src="/dashboard/functions/toast-notifications.js"></script>
<script src="/static/dashboard/functions/countries/cities/edit.js"></script>
{% endblock %}
