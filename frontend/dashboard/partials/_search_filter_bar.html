{% load i18n %}
<form method="get" class="d-flex flex-wrap gap-2 align-items-center px-4 py-3 border-bottom btn-pill-group">
  <div class="position-relative" style="max-width: 260px; width: 100%;">
    <i class="ti ti-search position-absolute top-50 translate-middle-y text-muted" style="inset-inline-start: 0.75rem;"></i>
    <input type="text" name="q" value="{{ request.GET.q }}" class="form-control form-control-sm rounded-pill" style="padding-inline-start: 2rem;"
           placeholder="{% translate "بحث..." %}">
  </div>
  {% if filter_choices %}
    <select name="filter" class="form-select form-select-sm rounded-pill" style="max-width: 220px;">
      <option value="">{{ filter_label }}</option>
      {% for value, label in filter_choices %}
        <option value="{{ value }}" {% if request.GET.filter == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  {% endif %}
  {% if missing_choices %}
    <select name="missing" class="form-select form-select-sm rounded-pill" style="max-width: 220px;">
      <option value="">{{ missing_label|default:_("مفقود منه...") }}</option>
      {% for value, label in missing_choices %}
        <option value="{{ value }}" {% if request.GET.missing == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  {% endif %}
  <button type="submit" class="btn btn-sm btn-primary">{% translate "بحث" %}</button>
  {% if request.GET.q or request.GET.filter or request.GET.missing %}
    <a href="{{ request.path }}" class="btn btn-sm btn-outline-secondary">{% translate "مسح" %}</a>
  {% endif %}
</form>
