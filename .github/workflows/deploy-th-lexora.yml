name: Deploy th.lexora.vip

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TH_LEXORA_SSH_HOST }}
          username: ${{ secrets.TH_LEXORA_SSH_USER }}
          key: ${{ secrets.TH_LEXORA_SSH_KEY }}
          script: |
            set -e
            cd /var/www/th-lexora
            git fetch origin main
            git reset --hard origin/main
            .venv/bin/pip install -q -r requirements.txt
            .venv/bin/python manage.py migrate --noinput
            .venv/bin/python manage.py collectstatic --noinput
            .venv/bin/python manage.py compilemessages -l en
            # All four services run as www-data, whose HOME resolves to
            # /var/www (owned by root, not writable by www-data) - torch/
            # Demucs then fails vocal-removal (Sing With Tamer, AI Remix)
            # with PermissionError trying to create ~/.cache there.
            # Idempotent: only patches a unit file that doesn't already
            # have this line, so re-running the deploy is a no-op here.
            for f in th-lexora.service th-lexora-2.service th-lexora-3.service th-lexora-celery.service; do
              sudo grep -q "Environment=XDG_CACHE_HOME" /etc/systemd/system/$f || \
                sudo sed -i "/^WorkingDirectory=/a Environment=XDG_CACHE_HOME=/var/www/th-lexora/.cache" /etc/systemd/system/$f
            done
            sudo systemctl daemon-reload
            # Three Daphne processes (8011/8012/8013) load-balanced by nginx
            # (see /etc/nginx/sites-available/th-lexora's upstream block) -
            # all three need restarting or two of them keep serving the
            # previous deploy's code until the next push.
            sudo systemctl restart th-lexora.service
            sudo systemctl restart th-lexora-2.service
            sudo systemctl restart th-lexora-3.service
            # Background jobs (Sing With Tamer's duet mix) - has its own
            # process since a slow job in it must never be able to
            # queue up behind (or block) a Daphne worker's own requests.
            sudo systemctl restart th-lexora-celery.service
